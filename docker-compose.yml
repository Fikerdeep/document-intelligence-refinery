services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${REFINERY_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: refinery
      POSTGRES_USER: refinery
      POSTGRES_PASSWORD: refinery
    ports:
      - "${REFINERY_PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  pg_data:
