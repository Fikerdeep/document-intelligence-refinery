[project]
name = "document-intelligence-refinery"
version = "0.0.1"
description = "Multi-stage document-extraction pipeline: coverage-residual routing, structure-preserving chunking, provenance-verified answers."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "docling>=2.0",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
